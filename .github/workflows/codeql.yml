name: CodeQL Security Scan

on:
  pull_request:
    branches:
      - dev
      - uat
      - main
  push:
    branches:
      - dev
      - main
      - uat
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CODEQL_DISABLE_TELEMETRY: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  # ─────────────────────────────────────────────
  # 1. Detect changes
  # ─────────────────────────────────────────────
  detect-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      run-codeql: ${{ steps.filter.outputs.run-codeql }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Python or JS changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -qE '\.(py|js|jsx|ts|tsx)$'; then
            echo "run-codeql=true" >> $GITHUB_OUTPUT
            echo "✅ Python/JS files detected — CodeQL will run"
          else
            echo "run-codeql=false" >> $GITHUB_OUTPUT
            echo "⏭️ No Python/JS files changed — skipping CodeQL"
          fi

  # ─────────────────────────────────────────────
  # 2. CodeQL analysis
  # ─────────────────────────────────────────────
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.run-codeql == 'true'

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3        # ✅ v3 (v4 does not exist)
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/vendor/**'
              - '**/dist/**'
              - '**/build/**'
              - '**/__pycache__/**'
              - '**/*.min.js'
              - '**/*.bundle.js'
              - '**/test/**'
              - '**/tests/**'
              - '**/*.test.js'
              - '**/*.spec.js'
              - '**/*.test.ts'
              - '**/*.spec.ts'
              - '**/test_*.py'
              - '**/*_test.py'
              - '**/migrations/**'
              - '**/fixtures/**'
              - '**/mock/**'
              - '**/mocks/**'
              - '**/generated/**'
              - '**/*.generated.js'
              - '**/coverage/**'
              - '**/.venv/**'
              - '**/venv/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3     # ✅ v3 (v4 does not exist)
        with:
          category: "/language:${{ matrix.language }}"
          upload: always

  # ─────────────────────────────────────────────
  # 3. Security gate
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate / Block Critical
    runs-on: ubuntu-latest
    needs: [detect-changes, codeql-analysis]      # ✅ Fixed: was `needs: analyze`
    timeout-minutes: 10
    if: |
      always() &&
      needs.detect-changes.outputs.run-codeql == 'true' &&
      needs.codeql-analysis.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'push')

    steps:
      - name: Check alerts & annotate PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: alerts } = await github.rest.codeScanning.listAlertsForRepo({
              owner:     context.repo.owner,
              repo:      context.repo.repo,
              ref:       context.sha,
              state:     'open',
              tool_name: 'CodeQL',
              per_page:  100,
            });
            if (alerts.length === 0) {
              core.info('✅ No open CodeQL alerts for this commit.');
              return;
            }
            core.info(`Found ${alerts.length} open CodeQL alert(s).`);
            const critical = [], high = [], medium = [], low = [];
            for (const alert of alerts) {
              const loc = alert.most_recent_instance?.location;
              const sev = alert.rule?.security_severity_level ?? 'unknown';
              const item = {
                sev,
                ruleId:   alert.rule?.id ?? 'unknown',
                desc:     alert.rule?.description ?? '',
                filePath: loc?.path ?? '',
                line:     loc?.start_line ?? '?',
                url:      alert.html_url ?? '',
              };
              if      (sev === 'critical') critical.push(item);
              else if (sev === 'high')     high.push(item);
              else if (sev === 'medium')   medium.push(item);
              else                         low.push(item);
            }
            function badge(sev) {
              if (sev === 'critical') return '🚨 **CRITICAL**';
              if (sev === 'high')     return '⚠️ **HIGH**';
              if (sev === 'medium')   return '🔵 **MEDIUM**';
              return '⚪ **LOW**';
            }
            const visibleFindings = [...critical, ...high, ...medium, ...low];
            const branch = context.ref?.replace('refs/heads/', '') ?? context.ref;
            let body = `## 🔐 CodeQL Security Findings\n\n`;
            if (critical.length) {
              body += `> ❌ **${critical.length} critical finding(s) — merge is BLOCKED.**\n\n`;
            } else {
              body += `> ✅ No critical security issues found! Merge is unblocked.\n\n`;
            }
            if (visibleFindings.length > 0) {
              body += `| Severity | Rule | File | Line | Description | Link |\n`;
              body += `|---|---|---|---|---|---|\n`;
              for (const f of visibleFindings) {
                body += `| ${badge(f.sev)} | \`${f.ruleId}\` | \`${f.filePath}\` | ${f.line} | ${f.desc} | [→](${f.url}) |\n`;
              }
            } else {
              body += `_No findings._\n`;
            }
            body += `\n---\n_CodeQL · \`${branch}\` · ${new Date().toUTCString()}_`;
            if (context.eventName === 'pull_request') {
              const prNumber = context.payload.pull_request.number;
              const marker   = '<!-- codeql-findings -->';
              const fullBody = `${marker}\n${body}`;
              const { data: comments } = await github.rest.issues.listComments({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: prNumber,
                per_page:     100,
              });
              const existing = comments.find(c => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: existing.id,
                  body:       fullBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: prNumber,
                  body:         fullBody,
                });
              }
            }
            if (context.eventName === 'push' && visibleFindings.length > 0) {
              const issueMarker = `<!-- codeql-${context.sha} -->`;
              const issueTitle  = `🔐 CodeQL findings on \`${branch}\` — ${new Date().toLocaleDateString('en-CA')}`;
              const issueBody   = `${issueMarker}\n${body}`;
              const { data: existingIssues } = await github.rest.issues.listForRepo({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                state:    'open',
                labels:   'codeql',
                per_page: 50,
              });
              const existing = existingIssues.find(i => i.body?.includes(issueMarker));
              if (existing) {
                await github.rest.issues.update({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: existing.number,
                  body:         issueBody,
                });
                core.info(`Updated tracking issue #${existing.number}`);
              } else {
                for (const [name, color] of [['security','e11d48'],['codeql','f97316']]) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo:  context.repo.repo,
                      name, color
                    });
                  } catch(_) {}
                }
                const { data: newIssue } = await github.rest.issues.create({
                  owner:  context.repo.owner,
                  repo:   context.repo.repo,
                  title:  issueTitle,
                  body:   issueBody,
                  labels: ['security', 'codeql'],
                });
                core.info(`Opened tracking issue #${newIssue.number}: ${newIssue.html_url}`);
              }
            }
            for (const f of high) {
              core.warning(`[HIGH] ${f.ruleId}: ${f.desc} — ${f.filePath}:${f.line}`);
            }
            for (const f of critical) {
              core.error(`[CRITICAL] ${f.ruleId}: ${f.desc} — ${f.filePath}:${f.line}`);
            }
            if (critical.length > 0) {
              core.setFailed(
                context.eventName === 'pull_request'
                  ? `Merge blocked: ${critical.length} critical finding(s). See PR comment for details.`
                  : `⚠️ ${critical.length} critical finding(s) on ${branch}. Tracking issue opened.`
              );
            }
